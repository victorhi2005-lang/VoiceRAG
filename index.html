<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 知識庫系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <style>
        /*自訂捲軸*/
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #d1d5db; }
    </style>
</head>
<body class="bg-white flex h-screen overflow-hidden text-gray-800 font-sans">

    <aside class="w-80 bg-gray-50 border-r border-gray-200 flex flex-col hidden md:flex">
        <div class="p-5 border-b border-gray-200">
            <h1 class="text-xl font-medium text-gray-900">知識庫控制台</h1>
        </div>
        
        <div class="p-5 flex-1 overflow-y-auto space-y-8">
            <div class="space-y-3">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest">建立記憶</h2>
                <input type="file" id="audioFile" accept="audio/*" class="w-full text-sm text-gray-600 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-white file:border file:border-gray-300 file:text-gray-700 hover:file:bg-gray-100 transition cursor-pointer">
                <button id="uploadBtn" onclick="uploadAudio()" class="w-full bg-gray-900 text-white font-medium py-2.5 rounded-lg hover:bg-black transition duration-200">
                    開始萃取
                </button>
                <div id="uploadStatus" class="text-sm text-gray-400 text-center hidden animate-pulse">系統處理中...</div>
            </div>

            <div class="space-y-3">
                <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-widest">最新萃取重點</h2>
                <div id="uploadResult" class="p-4 bg-white border border-gray-100 rounded-lg text-sm text-gray-700 hidden max-h-[40vh] overflow-y-auto whitespace-pre-wrap leading-relaxed shadow-sm"></div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative bg-white h-screen overflow-hidden">
        
        <div id="chatHistory" class="flex-1 overflow-y-auto p-4 md:p-8 pb-8 space-y-8 min-h-0">
            <div class="flex max-w-4xl mx-auto">
                <div class="w-8 h-8 rounded-full bg-gray-900 flex items-center justify-center text-white font-medium mr-4 shrink-0">AI</div>
                <div class="text-gray-800 pt-1">
                    <p>你好！我是你的專屬 AI 知識助理。請先從左側上傳語音檔案建立知識庫，接著就能開始進行檢索提問。</p>
                </div>
            </div>
        </div>

        <div class="w-full shrink-0 bg-white pt-2 pb-6 px-4 md:px-8">
            <div class="max-w-3xl mx-auto relative flex items-end bg-gray-50 rounded-2xl p-2 border border-gray-200 focus-within:ring-1 focus-within:ring-gray-300 focus-within:bg-white transition-colors shadow-sm">
                <textarea id="questionInput" rows="1" class="w-full max-h-40 bg-transparent border-none focus:ring-0 px-4 py-3 outline-none text-base resize-none" placeholder=""></textarea>
                
                <button id="askBtn" onclick="askQuestion()" class="p-3 m-1 bg-gray-900 text-white rounded-xl hover:bg-black transition duration-200 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 10.5 12 3m0 0 7.5 7.5M12 3v18" />
                    </svg>
                </button>
            </div>
            <div class="text-center text-xs text-gray-400 mt-3">AI 系統檢索可能會有誤差，請以實際知識庫內容為主。</div>
        </div>
    </main>

    <script>
        // 自動調整輸入框高度與支援 Enter 送出
        const inputEl = document.getElementById('questionInput');
        inputEl.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                askQuestion();
            }
        });

        inputEl.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        }, false);

        async function uploadAudio() {
            const fileInput = document.getElementById('audioFile');
            const statusDiv = document.getElementById('uploadStatus');
            const resultDiv = document.getElementById('uploadResult');
            const btn = document.getElementById('uploadBtn');

            if (fileInput.files.length === 0) return;

            btn.disabled = true;
            btn.classList.add('opacity-40', 'cursor-not-allowed');
            statusDiv.classList.remove('hidden');
            resultDiv.classList.add('hidden');
            statusDiv.innerHTML = '正在聆聽並萃取...';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/upload-audio/', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.status === 'success') {
                    statusDiv.classList.add('hidden');
                    resultDiv.innerHTML = data.structured_knowledge;
                    resultDiv.classList.remove('hidden');
                } else {
                    statusDiv.innerHTML = '發生錯誤';
                }
            } catch (error) {
                statusDiv.innerHTML = '網路連線異常';
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
            }
        }

        async function askQuestion() {
            const question = inputEl.value.trim();
            const btn = document.getElementById('askBtn');

            if (!question) return;

            // 將使用者的問題加入畫面對話中
            appendMessage('User', question);
            
            // 清空輸入框並恢復預設高度
            inputEl.value = '';
            inputEl.style.height = 'auto';
            
            // 鎖定狀態
            btn.disabled = true;
            btn.classList.add('opacity-40', 'cursor-not-allowed');
            inputEl.disabled = true;
            
            // 顯示 AI 正在思考的狀態
            const loadingId = 'loading-' + Date.now();
            appendMessage('AI', '...', loadingId, true);

            try {
                const response = await fetch('/ask-question/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await response.json();

                // 移除載入中泡泡
                document.getElementById(loadingId).remove();

                if (data.status === 'success') {
                    appendMessage('AI', data.answer);
                } else {
                    appendMessage('AI', '系統發生錯誤：' + data.message);
                }
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('AI', '網路連線異常，請檢查後端狀態。');
            } finally {
                btn.disabled = false;
                btn.classList.remove('opacity-40', 'cursor-not-allowed');
                inputEl.disabled = false;
                inputEl.focus();
            }
        }

        // 動態生成對話泡泡的函數
        function appendMessage(sender, text, id = null, animate = false) {
            const chatHistory = document.getElementById('chatHistory');
            const div = document.createElement('div');
            div.className = "flex max-w-4xl mx-auto w-full";
            if (id) div.id = id;

            if (sender === 'User') {
                // 使用者的文字框
                div.innerHTML = `
                    <div class="bg-gray-100 px-5 py-3.5 rounded-3xl text-gray-800 whitespace-pre-wrap max-w-2xl ml-auto text-base">${text}</div>
                `;
            } else {
                // AI 的文字框
                const pulseClass = animate ? 'animate-pulse' : '';
                div.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-gray-900 flex items-center justify-center text-white font-medium mr-4 shrink-0 mt-1">AI</div>
                    <div class="text-gray-800 pt-2 whitespace-pre-wrap leading-relaxed max-w-3xl text-base ${pulseClass}">${text}</div>
                `;
            }

            chatHistory.appendChild(div);
            
            // 新對話出現時，自動捲動到最底部
            chatHistory.scrollTo({
                top: chatHistory.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
